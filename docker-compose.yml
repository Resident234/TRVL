services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      # The catalog of text styles the settings page lists: it lives beside the
      # application instead of inside it, and the page only reads it.
      - ./styles:/var/www/styles:ro
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}
      DB_DSN: pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB:-yii_dev}
      DB_USERNAME: ${POSTGRES_USER:-yii}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      COOKIE_VALIDATION_KEY: ${COOKIE_VALIDATION_KEY:-}
      FORUM_LOGIN_USERNAME: ${FORUM_LOGIN_USERNAME:-}
      FORUM_LOGIN_PASSWORD: ${FORUM_LOGIN_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-@gsu_travels}
      # The settings page shows this interval and refuses a shorter gap between
      # the parts of one publication.
      TELEGRAM_PUBLISH_CRON_SCHEDULE: ${TELEGRAM_PUBLISH_CRON_SCHEDULE:-*/5 * * * *}
      # Empty keeps the mounted catalog above; a path here moves where the
      # settings page finds its text styles.
      STYLES_PATH: ${STYLES_PATH:-}
    # The text tools of the publication form call the proxy of the customer,
    # which runs on the machine that hosts the containers.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  parser:
    build:
      context: ./docker/php-cli
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    volumes:
      - ./app:/var/www/html
      - ./styles:/var/www/styles:ro
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}
      DB_DSN: pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB:-yii_dev}
      DB_USERNAME: ${POSTGRES_USER:-yii}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      FORUM_LOGIN_USERNAME: ${FORUM_LOGIN_USERNAME:-}
      FORUM_LOGIN_PASSWORD: ${FORUM_LOGIN_PASSWORD:-}
      # Only the scans of the forum and the tag pass: the publications queue
      # runs in the telegram service below, from the same image.
      CRON_ROLE: parser
      PARSER_CRON_SCHEDULE: ${PARSER_CRON_SCHEDULE:-0 4 * * *}
      FORUM_SECTION_PARSER_CRON_SCHEDULE: ${FORUM_SECTION_PARSER_CRON_SCHEDULE:-0 4 * * *}
      FORUM_POST_PARSER_CRON_SCHEDULE: ${FORUM_POST_PARSER_CRON_SCHEDULE:-*/10 * * * *}
      GALLERY_PARSER_CRON_SCHEDULE: ${GALLERY_PARSER_CRON_SCHEDULE:-*/10 * * * *}
      MEMBER_PARSER_CRON_SCHEDULE: ${MEMBER_PARSER_CRON_SCHEDULE:-*/10 * * * *}
      TAG_PARSER_CRON_SCHEDULE: ${TAG_PARSER_CRON_SCHEDULE:-*/10 * * * *}
      STYLES_PATH: ${STYLES_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  telegram:
    build:
      context: ./docker/php-cli
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    volumes:
      - ./app:/var/www/html
      - ./styles:/var/www/styles:ro
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}
      DB_DSN: pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB:-yii_dev}
      DB_USERNAME: ${POSTGRES_USER:-yii}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      # The queue of publications: what is due goes to the channel, what was
      # deleted comes out of it, what was edited is replaced there, and the
      # pictures it downloaded to send them are swept once a day.
      CRON_ROLE: telegram
      TELEGRAM_PUBLISH_CRON_SCHEDULE: ${TELEGRAM_PUBLISH_CRON_SCHEDULE:-*/5 * * * *}
      TELEGRAM_DELETE_CRON_SCHEDULE: ${TELEGRAM_DELETE_CRON_SCHEDULE:-*/5 * * * *}
      TELEGRAM_EDIT_CRON_SCHEDULE: ${TELEGRAM_EDIT_CRON_SCHEDULE:-*/5 * * * *}
      TELEGRAM_TEMP_CLEAN_CRON_SCHEDULE: ${TELEGRAM_TEMP_CLEAN_CRON_SCHEDULE:-0 4 * * *}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-@gsu_travels}
      # A publication of a forum topic is read back through the same HTTP client
      # the parsers use, so the queue needs its credentials too.
      FORUM_LOGIN_USERNAME: ${FORUM_LOGIN_USERNAME:-}
      FORUM_LOGIN_PASSWORD: ${FORUM_LOGIN_PASSWORD:-}
      STYLES_PATH: ${STYLES_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  llm:
    build:
      context: ./docker/php-cli
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    volumes:
      - ./app:/var/www/html
      - ./styles:/var/www/styles:ro
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}
      DB_DSN: pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB:-yii_dev}
      DB_USERNAME: ${POSTGRES_USER:-yii}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      # The queue of stylization jobs: what is queued goes to the proxy, what a
      # killed container left in running goes back to the queue, and what
      # finished three days ago leaves the table. The key it calls with is not
      # here — it lives in the llmApiKey row the settings page writes.
      CRON_ROLE: llm
      LLM_JOB_CRON_SCHEDULE: ${LLM_JOB_CRON_SCHEDULE:-* * * * *}
      # The style folder named by a job row is read from the same mount the
      # settings page lists.
      STYLES_PATH: ${STYLES_PATH:-}
    # The proxy of the customer runs on the machine that hosts the containers.
    # On a Linux host the name does not resolve without this line; on Docker
    # Desktop it is already there, and the line changes nothing.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-8081}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - appnet

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yii_dev}
      POSTGRES_USER: ${POSTGRES_USER:-yii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - appnet

volumes:
  pgdata:
  composer-cache:

networks:
  appnet:
