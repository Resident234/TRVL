[PHP]
date.timezone=UTC
memory_limit=512M
max_execution_time=120
display_errors=On
error_reporting=E_ALL
log_errors=On

; Files the publication form picks from a computer travel in the same request
; as the text. The defaults of PHP (2M/8M) stop a photo before the portal ever
; sees it; 30M is the largest file the settings page may allow, 32M is the whole
; request, and 60 files cover the albums of a form split into parts.
upload_max_filesize=30M
post_max_size=32M
max_file_uploads=60

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0

[assert]
zend.assertions=1
assert.exception=1
